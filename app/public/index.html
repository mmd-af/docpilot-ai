<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>DocPilot AI</title>
</head>
<body>
<h2>DocPilot AI</h2>
<input id="q" placeholder="Ask your question...">
<button onclick="ask()">Ask</button>
<p id="a"></p>

<script>
    async function ask() {
        const answer = document.getElementById('a');
        const question = document.getElementById('q').value.trim();

        if (!question) {
            answer.innerText = 'Please enter a question.';
            return;
        }

        answer.innerText = 'Thinking...';

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: question})
            });

            const data = await res.json();

            if (!res.ok) {
                throw new Error(data.error || `Request failed with status ${res.status}`);
            }

            answer.innerText = data.response;
        } catch (error) {
            answer.innerText = `Error: ${error.message}`;
        }
    }
</script>
</body>
</html>
