name: Deploy DocPilot AI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: app
        run: |
          npm ci
          uv sync

      - name: Ensure Vectorize index exists
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          index_name="docpilot-docs"

          if ! index_list="$(npx wrangler vectorize list --json)"; then
            echo "Could not list Vectorize indexes. Check the Cloudflare token, account ID, and permissions." >&2
            exit 1
          fi

          index_exists="$(
            printf '%s' "$index_list" |
              node -e '
                let input = "";
                process.stdin.on("data", chunk => input += chunk);
                process.stdin.on("end", () => {
                  const indexes = JSON.parse(input);
                  const found = (Array.isArray(indexes) ? indexes : [])
                    .some(index => index.name === process.argv[1]);
                  process.stdout.write(found ? "true" : "false");
                });
              ' "$index_name"
          )"

          if [ "$index_exists" = "false" ]; then
            echo "Creating missing Vectorize index: $index_name"
            npx wrangler vectorize create "$index_name" \
              --dimensions 768 \
              --metric cosine
          else
            echo "Vectorize index already exists: $index_name"
          fi

      - name: Ingest documentation into Vectorize
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          uv run python scripts/ingest.py \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --api-token "$CLOUDFLARE_API_TOKEN" \
            --index docpilot-docs \
            --docs docs

      - name: Deploy to Cloudflare Workers
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: uv run pywrangler deploy